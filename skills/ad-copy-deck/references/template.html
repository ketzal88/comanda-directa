<title>Copies — CLIENTE</title>

<script>
/* ============================================================
   LO UNICO QUE SE EDITA AL GENERAR UN DECK.
   El resto de la pagina renderiza sola desde acá.

   AGRUPADO POR CAMPO, NUNCA POR VARIACION. Meta Ads Manager pide
   los textos en pilas: primero los 5 textos principales, despues
   los 5 titulos, despues las descripciones. La pagina sigue ese
   orden para que se cargue de arriba a abajo sin saltar.

   Estructura:
     seccion = un TIPO DE CAMPO (Texto principal / Titulo / Descripcion)
     campo   = { label, limite, recomendado?, texto }
               label = el angulo ("vecinos", "la objecion"), para saber
               que es cada opcion sin que estorbe el copy-paste.
               limite = null -> muestra el largo sin juzgarlo (nombres de ad, URLs).

   Meta   -> 3 secciones: Texto principal (5), Titulo (5), Descripcion (5)
   Google -> 2 secciones: Titulos (15), Descripciones (4)

   Meta rota cada pool de forma INDEPENDIENTE: puede servir el texto
   principal 5 con el titulo 2. No hay pairing. Cada texto tiene que
   funcionar con cualquier otro.

   El contador y el rojo salen solos de `limite`. No hardcodear conteos:
   se calculan del texto real, asi no pueden mentir.

   `anuncio` y `utm` son opcionales: si estan, la pagina genera dos
   secciones extra al final (nombres de anuncio y parametros de URL).
   Ver el comentario de armarNombre() para por que el formato es asi.
   ============================================================ */
const DECK = {
  cliente: "Aires Publicidad",
  canal: "Meta · Feed / Reels / Stories",
  fecha: "2026-07-15",
  nota: "Registro: voseo liviano. CTA fija: Enviar mensaje → WhatsApp.",

  // Nombres de anuncio. Ver armarNombre() para el formato.
  anuncio: {
    separador: " - ",
    fijo: ["Script3", "Antes/Después"],   // el guion y su estructura: iguales para todo el deck
    variantes: ["Question Hook"],          // lo que cambia entre copies: uno por angulo, en orden
  },

  // Parametros de tracking. `params` va tal cual en Ads Manager.
  utm: {
    destino: "https://ejemplo.com/",
    params: "utm_source=facebook&utm_medium=paid_social&utm_campaign={{campaign.name}}&utm_id={{campaign.id}}&utm_content={{ad.name}}&utm_term={{adset.name}}",
  },

  secciones: [
    {
      titulo: "Antes / Después",
      subtitulo: "transformación · Schwartz 2→3",
      campos: [
        { label: "Texto principal", limite: 125, recomendado: null,
          texto: "Tu local puede ser el mejor del rubro, pero si no se ve, no entra nadie." },
        { label: "Título", limite: 40, recomendado: 27,
          texto: "De pasar desapercibido a imposible" },
        { label: "Descripción", limite: 25, recomendado: null,
          texto: "Diseño, fabricación y colocación" },
      ],
    },
  ],
};
</script>

  /* Estado copiado: queda pintado hasta que lo destildes o resetees.

<div class="wrap">
  <header>
    <div class="brand">Worker<span class="dot">.</span> — copies para ads</div>
    <h1 id="h-cliente"></h1>
    <div class="meta-linea">
      <span id="h-canal"></span>

    </div>

    <div class="progreso">
      <div class="barra"><i id="h-barra"></i></div>
      <span class="progreso-txt" id="h-progreso"></span>
      <button class="reset" id="h-reset">Destildar todo</button>
    </div>
  </header>
  <main id="deck"></main>
  <footer>Worker<span style="color:var(--c-accent)">.</span> — uso interno · el conteo se calcula del texto real</footer>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  document.title = "Copies — " + DECK.cliente;
  $("h-cliente").textContent = DECK.cliente;
  $("h-canal").textContent = DECK.canal;
  $("h-fecha").textContent = DECK.fecha;
  $("h-nota").textContent = DECK.nota || "";

  /* ---------- Nombre de anuncio ----------
     Formato: Guion - Estructura - Hook   ->  Script1 - Problema/Solución - Negative Hook

     Las tres dimensiones que se comparan despues entre videos: que guion, con que
     estructura narrativa, y como abre. `fijo` es el guion y su estructura (no cambian
     dentro de un deck: es el mismo video); `variantes` es el hook, que es lo unico
     que distingue a un copy del otro.

     Se escribe legible a proposito, aunque viaje al utm_content via {{ad.name}}:
     "AD5" en un reporte de GA4 no dice nada, y "Negative Hook" si. */
  function armarNombre(a, variante) {
    return a.fijo.concat([variante]).filter(Boolean).join(a.separador || " - ");
  }

  /* La pagina arma las secciones extra para no obligar a escribirlas a mano
     en cada deck: salen de `anuncio` y `utm`. */
  const secciones = DECK.secciones.slice();

  if (DECK.anuncio && DECK.anuncio.variantes && DECK.anuncio.variantes.length) {
    secciones.push({
      titulo: "Nombre del anuncio",
      subtitulo: "uno por ángulo · " + DECK.anuncio.variantes.length,
      aviso: "Guion - Estructura - Hook. Los dos primeros no cambian dentro del deck (es el mismo " +
             "video, la misma estructura); lo que distingue a cada anuncio es el hook, que es " +
             "justamente lo que cambia entre los copies. Este nombre viaja al utm_content vía {{ad.name}}.",
      tecnico: true,
      campos: DECK.anuncio.variantes.map((v, i) => ({
        label: (i + 1) + " · " + v,
        limite: null,
        texto: armarNombre(DECK.anuncio, v),
      })),
    });
  }

  if (DECK.utm && DECK.utm.params) {
    const campos = [{
      label: "Parámetros de URL (campo “Parámetros de URL” del ad)",
      limite: null,
      texto: DECK.utm.params,
    }];
    if (DECK.utm.destino) {
      campos.push({
        label: "URL completa (si preferís pegarla en el destino)",
        limite: null,
        texto: DECK.utm.destino + (DECK.utm.destino.indexOf("?") === -1 ? "?" : "&") + DECK.utm.params,
      });
    }
    secciones.push({
      titulo: "Tracking",
      subtitulo: "macros dinámicos de Meta · se resuelven en el click",
      aviso: "Va en Ads Manager → nivel anuncio → Seguimiento → Parámetros de URL. " +
             "Los {{macros}} los completa Meta al servir, así que el nombre de campaña, " +
             "de conjunto y de anuncio viajan tal cual estén escritos: si tienen espacios, viajan con espacios.",
      tecnico: true,
      campos: campos,
    });
  }

  let totalCampos = 0, pasados = 0, copiados = 0;
  const main = $("deck");

  secciones.forEach((sec) => {
    const box = document.createElement("section");
    box.className = "seccion";

    const h2 = document.createElement("h2");
    h2.textContent = sec.titulo;
    box.appendChild(h2);

    if (sec.subtitulo) {
      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = sec.subtitulo;
      box.appendChild(sub);
    }
    if (sec.aviso) {
      const av = document.createElement("p");
      av.className = "aviso";
      av.textContent = sec.aviso;
      box.appendChild(av);
    }

    sec.campos.forEach((campo) => {
      totalCampos++;
      // El largo sale del texto real. Un conteo escrito a mano miente en cuanto
      // alguien edita el texto y se olvida de actualizarlo.
      const largo = campo.texto.length;
      const tieneLimite = typeof campo.limite === "number";
      const sePasa = tieneLimite && largo > campo.limite;
      if (sePasa) pasados++;

      const div = document.createElement("div");
      div.className = "campo" + (sePasa ? " pasado" : "");

      const head = document.createElement("div");
      head.className = "campo-head";

      const label = document.createElement("span");
      label.className = "campo-label";
      label.textContent = campo.label;

      const conteo = document.createElement("span");
      conteo.className = "conteo" + (sePasa ? " pasado" : "");
      let txt;
      if (!tieneLimite) {
        // Nombres de ad y URLs no tienen un limite que valga la pena vigilar:
        // mostrar el largo sin verde ni rojo evita un semaforo que no significa nada.
        txt = largo + " car.";
        conteo.className = "conteo neutro";
      } else if (sePasa) {
        txt = largo + "/" + campo.limite + "  ✗ se pasa por " + (largo - campo.limite);
      } else if (campo.recomendado && largo > campo.recomendado) {
        txt = largo + "/" + campo.limite + "  ⚠ se corta después de " + campo.recomendado;
        conteo.className = "conteo aviso";
      } else {
        txt = largo + "/" + campo.limite + "  ✓";
      }
      conteo.textContent = txt;

      head.appendChild(label);
      head.appendChild(conteo);
      div.appendChild(head);

      const texto = document.createElement("div");
      texto.className = "texto" + (sec.tecnico ? " tecnico" : "");
      texto.textContent = campo.texto;
      div.appendChild(texto);

      const acciones = document.createElement("div");
      acciones.className = "acciones";
      const btn = document.createElement("button");
      btn.textContent = "Copiar";
      btn.addEventListener("click", () => copiar(campo.texto, btn, texto, div));
      acciones.appendChild(btn);
      div.appendChild(acciones);

      box.appendChild(div);
    });

    main.appendChild(box);
  });

  $("h-resumen").textContent =
    totalCampos + " campos" + (pasados ? " · " + pasados + " se pasan" : " · todos en spec");

  function pintarProgreso() {
    $("h-progreso").textContent = copiados + "/" + totalCampos + " copiados";
    $("h-barra").style.width = (totalCampos ? (copiados / totalCampos) * 100 : 0) + "%";
  }
  pintarProgreso();

  $("h-reset").addEventListener("click", () => {
    document.querySelectorAll(".campo.copiado").forEach((c) => c.classList.remove("copiado"));
    copiados = 0;
    pintarProgreso();
  });

  async function copiar(texto, btn, nodo, campo) {
    let ok = false;
    try {
      await navigator.clipboard.writeText(texto);
      ok = true;
    } catch (e) {
      // La clipboard API pide contexto seguro y permiso. Si la niegan, execCommand
      // sobre un textarea fuera de pantalla todavia funciona en la mayoria de los browsers.
      const ta = document.createElement("textarea");
      ta.value = texto;
      ta.style.position = "fixed";
      ta.style.top = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      document.body.removeChild(ta);
    }
    if (!ok) {
      // Ultimo recurso: dejar el bloque real seleccionado para que Ctrl+C alcance.
      // Sin esto, "copia a mano" manda a seleccionar algo que no esta seleccionado.
      const sel = window.getSelection();
      const rango = document.createRange();
      rango.selectNodeContents(nodo);
      sel.removeAllRanges();
      sel.addRange(rango);
    }
    // Solo cuenta como copiado si de verdad entro al portapapeles. Pintar en verde
    // algo que fallo es peor que no pintar nada: te hace saltear un campo.
    if (ok && !campo.classList.contains("copiado")) {
      campo.classList.add("copiado");
      copiados++;
      pintarProgreso();
    }
    btn.textContent = ok ? "Copiado" : "Ctrl+C — ya está seleccionado";
    btn.classList.toggle("listo", ok);
    btn.classList.toggle("manual", !ok);
    setTimeout(() => {
      btn.textContent = campo.classList.contains("copiado") ? "Copiar de nuevo" : "Copiar";
      btn.classList.remove("listo", "manual");
    }, 2000);
  }
})();
</script>
