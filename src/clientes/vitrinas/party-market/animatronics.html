<!DOCTYPE html><html lang="es"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Party Market · __TITULO__</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&amp;display=swap">
<style>
:root{
  --bg:#f7f1fa; --surface:#ffffff; --ink:#2a1636; --muted:#6f5c7b; --line:#e4d8ea;
  --accent:#e8621a; --accent-ink:#ffffff; --plum:#4b1f63; --chip:#efe5f4; --ok:#1f8a4c;
  --display:"Bowlby One SC","Arial Black",Impact,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170c1f; --surface:#22142d; --ink:#f4ecf8; --muted:#b5a3c1; --line:#3a2749;
  --accent:#ff8a3d; --accent-ink:#1c0f00; --plum:#2e163d; --chip:#2d1c3a; --ok:#54c98a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170c1f; --surface:#22142d; --ink:#f4ecf8; --muted:#b5a3c1; --line:#3a2749;
  --accent:#ff8a3d; --accent-ink:#1c0f00; --plum:#2e163d; --chip:#2d1c3a; --ok:#54c98a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{background:var(--plum);color:#fff}
header.hero .wrap{padding-block:30px 24px;display:flex;flex-direction:column;gap:12px}
.brand{font-family:var(--display);font-size:clamp(28px,6vw,48px);line-height:.95;letter-spacing:.01em;margin:0;text-wrap:balance}
.brand span{color:#ff9a52;display:block;font-size:.46em;letter-spacing:.08em}
.hero p{margin:0;max-width:46ch;color:#e9dcef;font-size:14.5px}
.ship{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px;width:fit-content}
.ship b{color:#ff9a52}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .wrap{padding-block:11px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.chip{flex:none;font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:7px 13px;background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:18px 48px}
section.cat{margin-bottom:30px;scroll-margin-top:72px}
section.cat h2{font-family:var(--display);font-size:21px;letter-spacing:.02em;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
section.cat h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.media{position:relative;aspect-ratio:4/3;background:#fff;display:grid;place-items:center;overflow:hidden}
/* Las fotos del catálogo son recortes sobre blanco: `contain` las muestra
   enteras (no las corta) y el fondo blanco las integra. El video sí va `cover`
   porque es una escena a sangre. */
.media img{width:100%;height:100%;object-fit:contain;display:block;padding:10px}
.media video{width:100%;height:100%;object-fit:cover;display:block;background:#1a0f24}
.media .mark{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(145deg,#3a1750,#6a2a86);color:#f4ecf8;text-align:center;padding:12px}
.media .mark .pk{font-size:44px;line-height:1}
.media .mark b{font-family:var(--display);font-size:13px;letter-spacing:.06em;color:#ff9a52}
.media .mark span{font-size:11px;color:#e9dcef}
.info{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.name{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15;margin:0;letter-spacing:.01em}
.desc{margin:0;font-size:13.5px;color:var(--muted);line-height:1.4}
.med{margin:0;font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:5px}
.med span{font-size:13px}
.prices{margin-top:auto;font-variant-numeric:tabular-nums;display:grid;gap:2px;padding-top:4px}
.ef{font-weight:800;font-size:17px;line-height:1.2}
.ef span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cuo{font-size:14px;color:var(--ink);font-weight:600}
.cuo b{color:var(--accent)}
.tj{font-size:12px;color:var(--muted)}
.btn{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:12px;padding:11px 12px;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.add{background:var(--accent);color:var(--accent-ink);margin-top:4px}
.btn.sold{background:var(--chip);color:var(--muted);cursor:not-allowed;margin-top:4px}
.empty{color:var(--muted);padding:48px 0;text-align:center}
/* Vendidos: cartel VENDIDO sobre la foto, tarjeta en gris. Disponibles con una
   sola unidad: badge arriba de la foto. */
.media .sold{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;background:rgba(20,8,28,.42)}
.media .sold b{font-family:var(--display);font-size:22px;letter-spacing:.12em;color:#fff;background:#c0352f;padding:7px 16px;border-radius:8px;transform:rotate(-7deg);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.media .badge{position:absolute;top:8px;left:8px;z-index:3;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:11px;letter-spacing:.02em;padding:4px 9px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.card.vendido .media img,.card.vendido .media video,.card.vendido .media .mark{opacity:.5;filter:grayscale(.6)}
.card.vendido .info{opacity:.6}
.panel{position:fixed;inset:0;z-index:20;background:rgba(15,5,20,.55);display:flex;justify-content:flex-end}
.sheet{background:var(--surface);color:var(--ink);width:min(440px,100%);height:100%;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3{font-family:var(--display);font-size:22px;margin:0;font-weight:400}
.prod{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.prod .pn{font-weight:800;font-size:15px}
.prod .pp{margin-top:6px;font-size:14px;font-variant-numeric:tabular-nums}
.prod .pp b{color:var(--accent)}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
legend{font-weight:800;font-size:13px;padding:0;margin-bottom:2px}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;font-size:14px}
.pay label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.pay input{margin-top:2px;accent-color:var(--accent)}
.pay .t{font-weight:700}
.pay .s{display:block;font-size:12.5px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.field{display:grid;gap:5px}
.field label{font-weight:700;font-size:13px}
.field input{font:inherit;font-size:16px;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.field .err{font-size:12.5px;color:#d13a3a;font-weight:600;min-height:0}
.field.bad input{border-color:#d13a3a}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.send{display:grid;gap:8px;margin-top:2px}
.send .btn.add{text-align:center;text-decoration:none;display:block}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}@media (hover:hover){.card:hover{transform:translateY(-2px)}}}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
</style>
<header class="hero"><div class="wrap">
  <h1 class="brand"><span>Party Market</span><span id="h1t">__TITULO__</span></h1>
  <p>Elegí el producto, mirá el precio y mandá el pedido. Hay una sola unidad de cada uno.</p>
  <span class="ship" id="ship"></span>
</div></header>
<div class="bar"><div class="wrap" id="tabs" role="tablist" aria-label="Categorías"></div></div>
<main><div class="wrap" id="list"></div></main>

<div class="panel" id="panel" hidden=""><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pt">
  <div class="top"><h3 id="pt">Lo quiero</h3><button class="btn" id="close" type="button">Cerrar</button></div>
  <div class="prod"><div class="pn" id="pn"></div><div class="pp" id="pp"></div></div>
  <form id="form" novalidate="">
    <fieldset class="pay"><legend>Forma de pago</legend>
      <label><input type="radio" name="pago" value="efectivo" checked=""><span><span class="t">Efectivo o transferencia</span><span class="s" id="payEf"></span></span></label>
      <label><input type="radio" name="pago" value="tarjeta"><span><span class="t">Tarjeta en 3 cuotas sin interés</span><span class="s" id="payTj"></span></span></label>
    </fieldset>
    <div class="field" style="margin-top:14px"><label for="fn">Nombre</label><input id="fn" name="nombre" type="text" autocomplete="name" maxlength="120" required=""><div class="err" id="eNombre"></div></div>
    <div class="field"><label for="ft">Teléfono</label><input id="ft" name="telefono" type="tel" inputmode="tel" autocomplete="tel" maxlength="40" required=""><div class="err" id="eTelefono"></div></div>
    <div class="field"><label for="fz">Zona de entrega</label><input id="fz" name="zona" type="text" maxlength="120" placeholder="Barrio o localidad" required=""><div class="err" id="eZona"></div></div>
    <div class="send">
      <a class="btn add" id="wa" href="#" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
      <button class="btn" id="copy" type="button">Copiar pedido</button>
      <p class="hint" id="shipHint"></p>
    </div>
  </form>
</div></div>

<script id="data" type="application/json">__DATOS__</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const WA='__WHATSAPP__';
const fmt=n=>'$'+Number(n).toLocaleString('es-AR',{maximumFractionDigits:0});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// La foto va por /_next/image (achica, pasa a webp y saca metadatos); el
// src es una ruta de nuestro dominio que sirve la foto original.
const opt=(u,w)=>'/_next/image?url='+encodeURIComponent(u)+'&w='+w+'&q=70';
const PH='<div class="mark"><span class="pk">🎃</span><b>Party Market</b><span>Foto en camino</span></div>';
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
document.getElementById('ship').innerHTML='<b>Envío gratis</b> en Villanueva y Nordelta';
document.getElementById('shipHint').textContent=D.leyenda;
const byCat={};D.productos.forEach(p=>{(byCat[p.categoria]=byCat[p.categoria]||[]).push(p)});
const porSlug={};D.productos.forEach(p=>porSlug[p.slug]=p);

const tabs=document.getElementById('tabs');
let activa=D.categorias[0]||'';
tabs.innerHTML=D.categorias.map(c=>`<button type="button" class="chip" role="tab" data-c="${esc(c)}" aria-pressed="${c===activa?'true':'false'}">${esc(c)}</button>`).join('');
tabs.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;activa=b.dataset.c;
  tabs.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===activa?'true':'false'));
  const el=document.getElementById('cat-'+norm(activa).replace(/[^a-z0-9]+/g,'-'));
  if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-72,behavior:'smooth'})});

function media(p){
  if(p.video){
    const poster=p.foto?` poster="${esc(opt(p.foto,640))}"`:'';
    // Se reproduce solo (en silencio, en loop) cuando entra en pantalla: el
    // producto se ve en movimiento, que es lo que lo vende. Los controles
    // quedan para pausarlo o ponerle sonido.
    return `<div class="media"><video src="${esc(p.video)}"${poster} controls loop muted playsinline preload="metadata"></video></div>`;
  }
  // El placeholder va detrás; si la foto carga, la tapa; si falla, queda el
  // placeholder (onerror quita la imagen rota).
  if(p.foto)return `<div class="media">${PH}<img src="${esc(opt(p.foto,640))}" alt="${esc(p.nombre)}" loading="lazy" style="position:absolute;inset:0" onerror="this.remove()"></div>`;
  return `<div class="media">${PH}</div>`;
}
function card(p){
  // El cartel VENDIDO y el badge "última unidad" van adentro de .media, encima
  // de la foto.
  const overlay=p.vendido?'<div class="sold"><b>VENDIDO</b></div>'
    :(p.ultima?'<span class="badge">Última unidad en stock</span>':'');
  const mediaHtml=media(p).replace('<div class="media">','<div class="media">'+overlay);
  // Los vendidos no muestran cuotas ni botón de pedido.
  const cuota=p.vendido?'':`<div class="cuo">o 3 cuotas sin interés de <b>${fmt(p.cuota)}</b></div>`;
  const boton=p.vendido
    ?'<button type="button" class="btn sold" disabled>Vendido</button>'
    :`<button type="button" class="btn add" data-slug="${esc(p.slug)}">Lo quiero</button>`;
  return `<article class="card${p.vendido?' vendido':''}">${mediaHtml}<div class="info">`+
    `<h3 class="name">${esc(p.nombre)}</h3>`+
    `<p class="desc">${esc(p.descripcion)}</p>`+
    (p.medida?`<p class="med"><span aria-hidden="true">📏</span> ${esc(p.medida)}</p>`:'')+
    `<div class="prices">`+
      `<div class="ef"><span>Efectivo o transferencia</span>${fmt(p.efectivo)}</div>`+
      cuota+
      `<div class="tj">Total con tarjeta: ${fmt(p.tarjeta)}</div>`+
    `</div>`+
    boton+
  `</div></article>`;
}
function render(){
  const out=D.categorias.map(c=>{const ps=byCat[c]||[];if(!ps.length)return '';
    // Disponibles primero, vendidos al final.
    const disp=ps.filter(p=>!p.vendido), vend=ps.filter(p=>p.vendido);
    const ordenados=[...disp,...vend];
    const cont=`${disp.length} ${disp.length===1?'disponible':'disponibles'}`+
      (vend.length?` · ${vend.length} ${vend.length===1?'vendido':'vendidos'}`:'');
    const id='cat-'+norm(c).replace(/[^a-z0-9]+/g,'-');
    return `<section class="cat" id="${id}"><h2>${esc(c)}<small>${cont}</small></h2><div class="grid">${ordenados.map(card).join('')}</div></section>`}).join('');
  document.getElementById('list').innerHTML=out||'<p class="empty">Por ahora no hay productos disponibles. Escribinos y te contamos qué está por llegar.</p>';
}
render();

// Los videos de producto se reproducen solos mientras están a la vista y se
// pausan al salir: muestran el producto en movimiento sin bajar los seis a la
// vez. Se respeta "reducir movimiento": ahí no arrancan solos (queda el póster
// y los controles).
(function(){
  const vids=[...document.querySelectorAll('.media video')];
  if(!vids.length||!('IntersectionObserver'in window))return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    const v=e.target;
    if(e.isIntersecting){const p=v.play();if(p&&p.catch)p.catch(()=>{})}else v.pause();
  }),{threshold:0.5});
  vids.forEach(v=>io.observe(v));
})();

// --- Pedido de a un producto ---
const panel=document.getElementById('panel');
const form=document.getElementById('form');
let actual=null;
function resumenPago(p,modo){
  return modo==='tarjeta'
    ? `Tarjeta: 3 cuotas sin interés de ${fmt(p.cuota)} (total ${fmt(p.tarjeta)})`
    : `Efectivo o transferencia: ${fmt(p.efectivo)}`;
}
function abrir(slug){
  actual=porSlug[slug];if(!actual)return;
  document.getElementById('pn').textContent=actual.nombre;
  document.getElementById('payEf').textContent=fmt(actual.efectivo);
  document.getElementById('payTj').textContent='3 × '+fmt(actual.cuota)+' (total '+fmt(actual.tarjeta)+')';
  form.reset();
  ['Nombre','Telefono','Zona'].forEach(limpiarError);
  actualizarPago();
  panel.hidden=false;document.getElementById('fn').focus();
}
function actualizarPago(){
  if(!actual)return;
  const modo=form.pago.value;
  document.getElementById('pp').innerHTML='<b>'+esc(resumenPago(actual,modo))+'</b>';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-slug]');if(b)abrir(b.dataset.slug)});
form.addEventListener('change',e=>{if(e.target.name==='pago')actualizarPago()});
document.getElementById('close').onclick=()=>panel.hidden=true;
panel.addEventListener('click',e=>{if(e.target===panel)panel.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')panel.hidden=true});

function limpiarError(campo){const f=document.getElementById('e'+campo);if(f){f.textContent='';f.parentElement.classList.remove('bad')}}
function ponerError(campo,msg){const f=document.getElementById('e'+campo);if(f){f.textContent=msg;f.parentElement.classList.add('bad')}}
function telefonoOk(v){return (v.replace(/\D/g,'')).length>=8}

function datosValidos(){
  let ok=true;
  const nombre=form.nombre.value.trim();
  const telefono=form.telefono.value.trim();
  const zona=form.zona.value.trim();
  if(!nombre){ponerError('Nombre','Poné tu nombre así sabemos de quién es el pedido.');ok=false}else limpiarError('Nombre');
  if(!telefono){ponerError('Telefono','Dejanos un teléfono para coordinar la entrega.');ok=false}
  else if(!telefonoOk(telefono)){ponerError('Telefono','Revisá el teléfono: código de área y número.');ok=false}
  else limpiarError('Telefono');
  if(!zona){ponerError('Zona','¿A qué zona va la entrega?');ok=false}else limpiarError('Zona');
  return ok?{nombre,telefono,zona}:null;
}
function mensaje(d){
  const p=actual,modo=form.pago.value;
  return 'Hola Party Market, quiero hacer este pedido:\n\n'+
    'Producto: '+p.nombre+'\n'+
    'Forma de pago: '+resumenPago(p,modo)+'\n\n'+
    'Nombre: '+d.nombre+'\n'+
    'Teléfono: '+d.telefono+'\n'+
    'Zona de entrega: '+d.zona+'\n\n'+
    D.leyenda;
}
const wa=document.getElementById('wa');
if(!WA)wa.style.display='none';
wa.addEventListener('click',e=>{
  const d=datosValidos();
  if(!d||!WA){e.preventDefault();if(!d)document.querySelector('.field.bad input')?.focus();return}
  wa.href='https://wa.me/'+WA+'?text='+encodeURIComponent(mensaje(d));
});
document.getElementById('copy').addEventListener('click',async e=>{
  const d=datosValidos();if(!d){document.querySelector('.field.bad input')?.focus();return}
  const t=mensaje(d);
  try{await navigator.clipboard.writeText(t);e.target.textContent='Pedido copiado'}
  catch(err){e.target.textContent='No se pudo copiar'}
  setTimeout(()=>e.target.textContent='Copiar pedido',2500);
});
['input','change'].forEach(ev=>form.addEventListener(ev,e=>{
  const n=e.target.name;if(n==='nombre')limpiarError('Nombre');if(n==='telefono')limpiarError('Telefono');if(n==='zona')limpiarError('Zona')}));
})();
</script>
</body></html>
