<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hacé tu pedido">
  <!--
    El favicon del producto: un ticket sobre el terracota de la marca.

    Es una versión SIMPLIFICADA del logo de la landing (`componentes/landing/
    Maqueta.tsx`), no el mismo dibujo. El logo tiene la impresora, la línea de
    corte punteada y tres renglones: a 16px eso es una mancha marrón. Acá queda
    una sola figura —el ticket con el borde dentado— que se sigue leyendo en la
    pestaña, y el fondo lleno para que no desaparezca sobre el blanco ni sobre
    el gris oscuro del navegador.

    Lo sirve Next desde `app/icon.svg`, que genera el <link rel="icon"> solo.
  -->
  <rect width="64" height="64" rx="15" fill="#c67139" />

  <!-- El ticket, con el borde de abajo dentado como el papel al cortarse.
       Tres dientes profundos y no cinco chicos: a 16px, cinco se promedian en
       una línea recta y el ticket queda siendo un cuadrado blanco. -->
  <path
    fill="#fdfbf7"
    d="M13 14a3 3 0 0 1 3-3h32a3 3 0 0 1 3 3v38l-8-6-11 6-11-6-8 6V14Z"
  />

  <!-- Dos renglones, uno largo y uno corto: es lo que lo hace leer como papel
       escrito y no como una hoja en blanco. Gruesos a propósito — a 16px un
       trazo fino desaparece contra el fondo claro del ticket. -->
  <rect x="20" y="21" width="24" height="6" rx="3" fill="#201e1d" />
  <rect x="20" y="32" width="15" height="6" rx="3" fill="#201e1d" opacity=".4" />
</svg>
